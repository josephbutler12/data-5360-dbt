version: 2

models:
  - name: oliver_dim_customer
    description: "Customer dimension for Oliver's retail data."
    columns:
      - name: customer_key
        tests:
          - not_null
          - unique

  - name: oliver_dim_employee
    description: "Employee dimension for Oliver's retail data."
    columns:
      - name: employee_key
        tests:
          - not_null
          - unique

  - name: oliver_dim_product
    description: "Product dimension for Oliver's retail data."
    columns:
      - name: product_key
        tests:
          - not_null
          - unique

  - name: oliver_dim_store
    description: "Store dimension for Oliver's retail data."
    columns:
      - name: store_key
        tests:
          - not_null
          - unique

  - name: oliver_dim_date
    description: "Date dimension generated using dbt_date."
    columns:
      - name: date_key
        tests:
          - not_null
          - unique

  - name: fact_sales
    description: "Sales fact table at the order line grain."
    columns:
      - name: sales_key
        tests:
          - not_null
          - unique

  - name: sales
    description: "Semantic model combining all dimensions with the fact table."

    models:
  - name: stg_employee_certifications
    description: "Staging model that parses certification JSON fields into structured columns for employee certifications."

  - name: fact_certification
    description: "Fact table at the grain of one certification awarded to one employee on one specific date."

