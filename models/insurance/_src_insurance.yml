
version: 2

sources:
  - name: insurance_landing
    database: JOSEPHBUTLER
    schema: insurance_dw_source
    tables:
      - name: agents
      - name: claims
      - name: customers
      - name: policies
      - name: customer_service_interactions

models:
  - name: stg_customer_service_interactions
    description: "Staging model for customer service interactions."
    columns:
      - name: issue_type
        tests:
          - accepted_values:
              arguments:
                values:
                  - "New Claim"
                  - "Claim Status"
                  - "Policy Change"
                  - "Coverage Info"
                  - "Billing Issue"
                  - "Policy Renewal"

  
  - name: fact_interaction
    description: "Fact table combining customer interactions with customer dimension."
    columns:
      - name: customer_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key


